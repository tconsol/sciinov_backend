# ===========================================
# Production Profile Configuration
# ===========================================
# This file is used when spring.profiles.active=prod
# ALL values MUST be set via environment variables
# No defaults - application will fail to start if variables are missing

spring.application.name=sciinovdbms
server.port=${SERVER_PORT}

# ===========================================
# MongoDB Configuration
# ===========================================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# ===========================================
# JWT Configuration
# ===========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# ===========================================
# File Upload Configuration
# ===========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===========================================
# SMTP Mail Configuration
# ===========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Custom mail properties
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME}

# ===========================================
# Google Cloud Storage Configuration
# ===========================================
gcs.project-id=${GCS_PROJECT_ID}
gcs.bucket-name=${GCS_BUCKET_NAME}
gcs.credentials-path=${GCS_CREDENTIALS_PATH}

# ===========================================
# Application URLs
# ===========================================
app.base-url=${APP_BASE_URL}
app.password-reset-url=${app.base-url}/reset-password

# ===========================================
# Swagger / OpenAPI
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===========================================
# Logging
# ===========================================
logging.level.root=WARN
logging.level.com.sciinov.dbms=INFO

