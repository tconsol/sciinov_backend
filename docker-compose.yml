version: '3.8'

services:
  sciinovdbms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sciinovdbms-prod
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - GCS_PROJECT_ID=${GCS_PROJECT_ID}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - GCS_CREDENTIALS_PATH=${GCS_CREDENTIALS_PATH}
      - APP_BASE_URL=${APP_BASE_URL}
      - APP_FRONTEND_BASE_URL=${APP_FRONTEND_BASE_URL}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - SWAGGER_UI_ENABLED=${SWAGGER_UI_ENABLED}
      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT}
      - LOG_LEVEL_APP=${LOG_LEVEL_APP}
      - SESSION_SECURE=${SESSION_SECURE}
    volumes:
      - ./logs:/app/logs
      - ${GCS_CREDENTIALS_PATH}:/app/${GCS_CREDENTIALS_PATH}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sciinovdbms-network

networks:
  sciinovdbms-network:
    driver: bridge

