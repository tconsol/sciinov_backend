# ===========================================
# Spring Boot Configuration
# ===========================================
spring.profiles.active=dev

# ===========================================
# Application Configuration
# ===========================================
spring.application.name=sciinovdbms
server.port=${SERVER_PORT:8080}

# ===========================================
# MongoDB Configuration
# ===========================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sciinovdbms}
spring.data.mongodb.auto-index-creation=true

# ===========================================
# JWT Configuration
# ===========================================
app.jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===========================================
# File Upload Configuration
# ===========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===========================================
# SMTP Mail Configuration
# ===========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test@gmail.com}
spring.mail.password=${MAIL_PASSWORD:testpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
spring.mail.properties.mail.smtp.socketFactory.fallback=true

# Custom mail properties
app.mail.from=${MAIL_FROM:noreply@sciinov.com}
app.mail.from-name=${MAIL_FROM_NAME:SciInov DBMS}

# ===========================================
# Google Cloud Storage Configuration
# ===========================================
gcs.project-id=${GCS_PROJECT_ID:fineflux}
gcs.bucket-name=${GCS_BUCKET_NAME:sciinov}
gcs.credentials-path=${GCS_CREDENTIALS_PATH:./fineflux-c0bba53c7d23.json}

# ===========================================
# Application URLs
# ===========================================
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.password-reset-url=${APP_PASSWORD_RESET_URL:${app.frontend-base-url}/reset-password}
app.forgot-password-url=${APP_FORGOT_PASSWORD_URL:${app.frontend-base-url}/forgot-password}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===========================================
# Swagger / OpenAPI
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===========================================
# Logging
# ===========================================
logging.level.root=INFO
logging.level.com.sciinov.dbms=INFO
logging.level.com.sciinov.dbms.controller=INFO
logging.level.com.sciinov.dbms.service=INFO
logging.level.com.sciinov.dbms.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] [%-5level] [%thread] %logger{36}.%M - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] [%-5level] [%thread] %logger{36}.%M - %msg%n

