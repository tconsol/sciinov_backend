# ==========================================
# SciInov DBMS - Application Configuration
# ==========================================
# All values are loaded from .env file via environment variables
# This file contains ONLY property key references, NO hardcoded values
# All configuration comes from .env file

# ==========================================
# Server Configuration
# ==========================================
spring.application.name=sciinovdbms
server.port=${SERVER_PORT}
server.servlet.context-path=/
server.shutdown=graceful
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Allow large file upload requests (100k rows can take time)
server.tomcat.connection-timeout=300000
server.tomcat.keep-alive-timeout=300000
# Tomcat thread pool - increased for better concurrency during bulk uploads (default is only 200)
# For 10k-record batches + async processing, 800 threads handles ~100+ concurrent requests
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:800}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:50}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:500}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:16384}
# Increase request wait timeout for large file uploads
server.tomcat.processor-cache=500

# ==========================================
# MongoDB Configuration
# ==========================================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false
# Connection pool settings (increase for better concurrent performance)
spring.data.mongodb.connection-pool.max-size=${MONGODB_MAX_POOL_SIZE:100}
spring.data.mongodb.connection-pool.min-size=${MONGODB_MIN_POOL_SIZE:10}
spring.data.mongodb.connection-pool.max-connection-idle-time=${MONGODB_MAX_IDLE_TIME:30000}
spring.data.mongodb.connection-pool.max-connection-life-time=${MONGODB_MAX_LIFE_TIME:0}
# Socket timeout for long queries (large file uploads)
spring.data.mongodb.socket-timeout=${MONGODB_SOCKET_TIMEOUT:300000}
spring.data.mongodb.server-selection-timeout=${MONGODB_SERVER_TIMEOUT:10000}

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}
# Refresh token valid for 7 days (604800000 ms)
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}
spring.servlet.multipart.resolve-lazily=true
server.tomcat.max-swallow-size=200MB

# ==========================================
# SMTP Mail Configuration
# ==========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT}
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Custom mail properties
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME}

# ==========================================
# Google Cloud Storage Configuration
# ==========================================
# All credentials loaded from .env file
gcs.project-id=${GCS_PROJECT_ID}
gcs.bucket-name=${GCS_BUCKET_NAME}
gcs.type=${GCS_TYPE:service_account}
gcs.private-key-id=${GCS_PRIVATE_KEY_ID:}
gcs.private-key=${GCS_PRIVATE_KEY:}
gcs.client-email=${GCS_CLIENT_EMAIL:}
gcs.client-id=${GCS_CLIENT_ID:}
gcs.auth-uri=${GCS_AUTH_URI:https://accounts.google.com/o/oauth2/auth}
gcs.token-uri=${GCS_TOKEN_URI:https://oauth2.googleapis.com/token}
gcs.auth-provider-x509-cert-url=${GCS_AUTH_PROVIDER_X509_CERT_URL:https://www.googleapis.com/oauth2/v1/certs}
gcs.client-x509-cert-url=${GCS_CLIENT_X509_CERT_URL:}
gcs.universe-domain=${GCS_UNIVERSE_DOMAIN:googleapis.com}

# ==========================================
# Application URLs
# ==========================================
app.base-url=${APP_BASE_URL}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
app.password-reset-url=${APP_PASSWORD_RESET_URL}
app.forgot-password-url=${APP_FORGOT_PASSWORD_URL}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ==========================================
# Swagger / OpenAPI Documentation
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED}

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=${LOG_LEVEL_ROOT}
logging.level.com.sciinov.dbms=${LOG_LEVEL_APP}
logging.level.com.sciinov.dbms.controller=${LOG_LEVEL_CONTROLLER}
logging.level.com.sciinov.dbms.service=${LOG_LEVEL_SERVICE}
logging.level.com.sciinov.dbms.security=${LOG_LEVEL_SECURITY}
logging.level.org.springframework=${LOG_LEVEL_SPRING}
logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SEC}
logging.level.org.mongodb.driver=${LOG_LEVEL_MONGO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] [%-5level] [%thread] %logger{36}.%M - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] [%-5level] [%thread] %logger{36}.%M - %msg%n
logging.file.name=${LOG_FILE_PATH}
logging.file.max-size=${LOG_MAX_SIZE}
logging.file.max-history=${LOG_MAX_HISTORY}

# ==========================================
# Management Endpoints (Actuator)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true

# ==========================================
# Session Management
# ==========================================
spring.session.store-type=none
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=${SESSION_MAX_AGE}
server.servlet.session.cookie.secure=${SESSION_SECURE}
server.servlet.session.cookie.same-site=strict

# ==========================================
# JPA Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ==========================================
# Task Execution
# ==========================================
spring.task.execution.pool.core-size=${TASK_CORE_SIZE}
spring.task.execution.pool.max-size=${TASK_MAX_SIZE}
spring.task.execution.pool.queue-capacity=${TASK_QUEUE_SIZE}

# ==========================================
# Charset Configuration
# ==========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==========================================
# CORS Logging (Debug)
# ==========================================
logging.level.org.springframework.web.cors=${LOG_LEVEL_CORS:INFO}
logging.level.com.sciinov.dbms.config.WebSecurityConfig=${LOG_LEVEL_SECURITY:INFO}
