# ==========================================
# SciInov DBMS - Application Configuration
# ==========================================
# All sensitive values are loaded from .env file via environment variables.
# Non-sensitive defaults are specified inline with ${VAR:default} syntax.

# ==========================================
# Server Configuration
# ==========================================
spring.application.name=sciinovdbms
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Allow large file upload requests (100k rows can take time)
server.tomcat.connection-timeout=600000
server.tomcat.keep-alive-timeout=600000
# Tomcat thread pool - OPTIMIZED FOR 512MB MEMORY LIMIT
# Reduced from 1000 to 300 threads to fit 512MB memory constraint
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=300
server.tomcat.max-connections=5000
# Increase request wait timeout for large file uploads
server.tomcat.processor-cache=200

# ==========================================
# MongoDB Configuration
# ==========================================
# MONGODB_URI must include database name, e.g.: mongodb+srv://user:pass@cluster.mongodb.net/dbname?appName=...
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false
# Connection pool settings - OPTIMIZED FOR MEMORY
# Reduced from 200 to 50 max connections to save memory
spring.data.mongodb.connection-pool.max-size=50
spring.data.mongodb.connection-pool.min-size=5
spring.data.mongodb.connection-pool.max-connection-idle-time=30000
spring.data.mongodb.connection-pool.max-connection-life-time=0
# Socket timeout for long queries (large file uploads)
spring.data.mongodb.socket-timeout=300000
spring.data.mongodb.server-selection-timeout=15000

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Refresh token valid for 7 days
app.jwt.refresh-expiration-days=7

# Super Admin default password (only used when seeding for the first time)
app.superadmin.default-password=${SUPER_ADMIN_DEFAULT_PASSWORD:#{null}}

# ==========================================
# File Upload Configuration - OPTIMIZED FOR MEMORY
# ==========================================
spring.servlet.multipart.enabled=true
# Reduced from 200MB to 100MB to reduce memory footprint during uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.resolve-lazily=true
server.tomcat.max-swallow-size=100MB

# ==========================================
# SMTP Mail Configuration
# ==========================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Custom mail properties
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:SciInov DBMS}

# ==========================================
# Google Cloud Storage Configuration
# ==========================================
# All GCS credentials loaded from environment variables for security
gcs.project-id=${GCS_PROJECT_ID}
gcs.bucket-name=${GCS_BUCKET_NAME}
gcs.type=${GCS_TYPE:service_account}
gcs.private-key-id=${GCS_PRIVATE_KEY_ID}
gcs.private-key=${GCS_PRIVATE_KEY}
gcs.client-email=${GCS_CLIENT_EMAIL}
gcs.client-id=${GCS_CLIENT_ID}
gcs.auth-uri=${GCS_AUTH_URI:https://accounts.google.com/o/oauth2/auth}
gcs.token-uri=${GCS_TOKEN_URI:https://oauth2.googleapis.com/token}
gcs.auth-provider-x509-cert-url=${GCS_AUTH_PROVIDER_X509_CERT_URL:https://www.googleapis.com/oauth2/v1/certs}
gcs.client-x509-cert-url=${GCS_CLIENT_X509_CERT_URL}
gcs.universe-domain=${GCS_UNIVERSE_DOMAIN:googleapis.com}

# ==========================================
# Application URLs
# ==========================================
app.base-url=${APP_BASE_URL:https://sciinovdbms-64307221061.asia-south1.run.app}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:https://sciinovdbms.com}
app.password-reset-url=${APP_PASSWORD_RESET_URL:https://sciinovdbms.com/reset-password}
app.forgot-password-url=${APP_FORGOT_PASSWORD_URL:https://sciinovdbms.com/forgot-password}

# CORS Configuration - loaded from environment
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://sciinovdbms.com,http://localhost:5173}

# ==========================================
# Swagger / OpenAPI Documentation
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=WARN
logging.level.com.sciinov.dbms=INFO
logging.level.com.sciinov.dbms.controller=INFO
logging.level.com.sciinov.dbms.service=INFO
logging.level.com.sciinov.dbms.security=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.mongodb.driver=WARN
logging.level.org.springframework.mail=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] [%-5level] [%thread] %logger{36}.%M - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] [%-5level] [%thread] %logger{36}.%M - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# ==========================================
# Management Endpoints (Actuator)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true

# ==========================================
# Session Management
# ==========================================
spring.session.store-type=none
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=604800
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ==========================================
# JPA Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ==========================================
# Task Execution - OPTIMIZED FOR MEMORY
# ==========================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=15
spring.task.execution.pool.queue-capacity=100

# ==========================================
# Charset Configuration
# ==========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==========================================
# CORS Logging (Debug)
# ==========================================
logging.level.org.springframework.web.cors=DEBUG
logging.level.com.sciinov.dbms.config.WebSecurityConfig=INFO
