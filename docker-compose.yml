version: '3.8'

services:
  sciinovdbms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sciinovdbms-prod
    ports:
      - "8080:8080"
    environment:
      # Server
      - SERVER_PORT=${SERVER_PORT}
      # MongoDB
      - MONGODB_URI=${MONGODB_URI}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      # File Upload
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE}
      # Mail
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_TIMEOUT=${MAIL_TIMEOUT}
      # GCS
      - GCS_PROJECT_ID=${GCS_PROJECT_ID}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - GCS_TYPE=${GCS_TYPE}
      - GCS_PRIVATE_KEY_ID=${GCS_PRIVATE_KEY_ID}
      - GCS_PRIVATE_KEY=${GCS_PRIVATE_KEY}
      - GCS_CLIENT_EMAIL=${GCS_CLIENT_EMAIL}
      - GCS_CLIENT_ID=${GCS_CLIENT_ID}
      - GCS_AUTH_URI=${GCS_AUTH_URI}
      - GCS_TOKEN_URI=${GCS_TOKEN_URI}
      - GCS_AUTH_PROVIDER_X509_CERT_URL=${GCS_AUTH_PROVIDER_X509_CERT_URL}
      - GCS_CLIENT_X509_CERT_URL=${GCS_CLIENT_X509_CERT_URL}
      - GCS_UNIVERSE_DOMAIN=${GCS_UNIVERSE_DOMAIN}
      # App URLs
      - APP_BASE_URL=${APP_BASE_URL}
      - APP_FRONTEND_BASE_URL=${APP_FRONTEND_BASE_URL}
      - APP_PASSWORD_RESET_URL=${APP_PASSWORD_RESET_URL}
      - APP_FORGOT_PASSWORD_URL=${APP_FORGOT_PASSWORD_URL}
      # CORS
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      # Swagger
      - SWAGGER_UI_ENABLED=${SWAGGER_UI_ENABLED}
      # Logging
      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT}
      - LOG_LEVEL_APP=${LOG_LEVEL_APP}
      - LOG_LEVEL_CONTROLLER=${LOG_LEVEL_CONTROLLER}
      - LOG_LEVEL_SERVICE=${LOG_LEVEL_SERVICE}
      - LOG_LEVEL_SECURITY=${LOG_LEVEL_SECURITY}
      - LOG_LEVEL_SPRING=${LOG_LEVEL_SPRING}
      - LOG_LEVEL_SPRING_SEC=${LOG_LEVEL_SPRING_SEC}
      - LOG_LEVEL_MONGO=${LOG_LEVEL_MONGO}
      - LOG_FILE_PATH=${LOG_FILE_PATH}
      - LOG_MAX_SIZE=${LOG_MAX_SIZE}
      - LOG_MAX_HISTORY=${LOG_MAX_HISTORY}
      # Session
      - SESSION_MAX_AGE=${SESSION_MAX_AGE}
      - SESSION_SECURE=${SESSION_SECURE}
      # Task Execution
      - TASK_CORE_SIZE=${TASK_CORE_SIZE}
      - TASK_MAX_SIZE=${TASK_MAX_SIZE}
      - TASK_QUEUE_SIZE=${TASK_QUEUE_SIZE}
    volumes:
      - ./logs:/app/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sciinovdbms-network

networks:
  sciinovdbms-network:
    driver: bridge

