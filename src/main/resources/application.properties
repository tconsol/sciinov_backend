# ==========================================
# SciInov DBMS - Production Configuration
# ==========================================
# All values can be overridden via environment variables
# Format: PROPERTY_NAME=value (dots replaced with underscores)

# ==========================================
# Server Configuration
# ==========================================
spring.application.name=sciinovdbms
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==========================================
# MongoDB Configuration
# ==========================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://sciinovdbms:Sciinovdbms123@sciinovdbms.jzwqqwk.mongodb.net/sciinovdbms?appName=sciinovdbms}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.connection-string=${MONGODB_URI:mongodb+srv://sciinovdbms:Sciinovdbms123@sciinovdbms.jzwqqwk.mongodb.net/sciinovdbms?appName=sciinovdbms}

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

# ==========================================
# SMTP Mail Configuration
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Custom mail properties
app.mail.from=${MAIL_FROM:noreply@sciinov.com}
app.mail.from-name=${MAIL_FROM_NAME:SciInov DBMS}

# ==========================================
# Google Cloud Storage Configuration
# ==========================================
gcs.project-id=${GCS_PROJECT_ID:fineflux}
gcs.bucket-name=${GCS_BUCKET_NAME:sciinov}
gcs.credentials-path=${GCS_CREDENTIALS_PATH:./fineflux-c0bba53c7d23.json}

# ==========================================
# Application URLs
# ==========================================
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.password-reset-url=${APP_PASSWORD_RESET_URL:${app.frontend-base-url}/reset-password}
app.forgot-password-url=${APP_FORGOT_PASSWORD_URL:${app.frontend-base-url}/forgot-password}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==========================================
# Swagger / OpenAPI Documentation
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.sciinov.dbms=${LOG_LEVEL_APP:INFO}
logging.level.com.sciinov.dbms.controller=${LOG_LEVEL_CONTROLLER:INFO}
logging.level.com.sciinov.dbms.service=${LOG_LEVEL_SERVICE:INFO}
logging.level.com.sciinov.dbms.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:WARN}
logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SEC:WARN}
logging.level.org.mongodb.driver=${LOG_LEVEL_MONGO:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] [%-5level] [%thread] %logger{36}.%M - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] [%-5level] [%thread] %logger{36}.%M - %msg%n
logging.file.name=${LOG_FILE_PATH:logs/application.log}
logging.file.max-size=${LOG_MAX_SIZE:10MB}
logging.file.max-history=${LOG_MAX_HISTORY:30}

# ==========================================
# Management Endpoints (Actuator)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true

# ==========================================
# Session Management
# ==========================================
spring.session.store-type=none
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_SECURE:false}
server.servlet.session.cookie.same-site=strict

# ==========================================
# JPA Configuration (if needed)
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ==========================================
# Task Execution
# ==========================================
spring.task.execution.pool.core-size=${TASK_CORE_SIZE:5}
spring.task.execution.pool.max-size=${TASK_MAX_SIZE:10}
spring.task.execution.pool.queue-capacity=${TASK_QUEUE_SIZE:100}

# ==========================================
# Charset Configuration
# ==========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
